[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "dataporter"
version = "0.1.0"
description = "Scalable delimited file ingestion framework for multiple database engines"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name = "DataPorter Contributors" }
]
keywords = ["etl", "data-ingestion", "databases", "data-pipelines"]

dependencies = [
  "pandas>=1.5,<3.0",
  "numpy>=1.22,<3.0",
  "PyYAML>=5.4,<7.0",
  "sqlalchemy>=1.4,<3.0",
  "portalocker>=2.0,<4.0",
]


[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.1,<4.0",
]

mysql = [
  "pymysql>=1.1.0,<2.0",
  "cryptography>=41.0.0,<47",
]

sqlserver = [
  "pyodbc>=4.0,<6.0",
]

gcp = [
  "google-cloud-bigquery>=3.30,<4.0",
  "google-cloud-storage>=2.0,<4.0",
]

dev = [
  "pytest>=7,<10",
  "pytest-cov>=3,<8",
  "black>=22,<27",
  "flake8>=4,<8",
  "pre-commit>=3,<5",
  "python-dateutil>=2.8,<3.0"
]


[tool.setuptools]
package-dir = { "" = "src" }


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310']

[tool.isort]
profile = "black"
