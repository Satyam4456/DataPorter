[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "dataporter"
version = "0.1.0"
description = "Scalable delimited file ingestion framework for multiple database engines"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name = "DataPorter Contributors" }
]
keywords = ["etl", "data-ingestion", "databases", "data-pipelines"]

dependencies = [
  "pandas>=1.3.0",
  "numpy>=1.21.0",
  "PyYAML>=5.4",
  "sqlalchemy>=1.4.0",
  "portalocker>=2.0.0",
]


[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.1.0",
]

mysql = [
  "pymysql>=1.0.0",
]

sqlserver = [
  "pyodbc>=4.0.0",
]

gcp = [
  "google-cloud-bigquery>=2.30.0",
  "google-cloud-storage>=2.0.0",
]

dev = [
  "pytest>=7.0.0",
  "pytest-cov>=3.0.0",
  "black>=22.0",
  "flake8>=4.0.0",
  "pre-commit>=3.0.0",
  "python-dateutil>=2.8.0",
]


[tool.setuptools]
package-dir = { "" = "src" }


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310']

[tool.isort]
profile = "black"
